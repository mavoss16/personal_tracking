name: Daily Data Update

# Runs at 07:00 UTC = 2:00 AM CDT (UTC-5). Shifts to 1:00 AM in winter (CST/UTC-6).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: # allows manual runs from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NOTION_TOKEN_SHINY: ${{ secrets.NOTION_TOKEN_SHINY }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      # Read the distro release (e.g. ubuntu-26.04) for the cache key. ImageOS is
      # set in the runner's shell environment but is not visible to the `env`
      # expression context, so it cannot be used in a key directly.
      - name: Identify runner image
        id: image
        run: echo "id=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "$GITHUB_OUTPUT"

      # The cache key must include the distro release and the R version. Compiled
      # packages such as stringi link against the image's system libraries
      # (libicu), so a library built on one Ubuntu release cannot load on the next
      # one — which is exactly how ubuntu-latest moving to 26.04 broke this job.
      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ steps.image.outputs.id }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('**/DESCRIPTION') }}-v1
          restore-keys: r-${{ steps.image.outputs.id }}-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Install CRAN packages
        run: |
          install.packages(c("dplyr", "lubridate", "zoo", "tidyr", "stringr", "readr", "remotes"))
        shell: Rscript {0}

      - name: Install notionR from GitHub
        run: remotes::install_github("Eflores89/notionR")
        shell: Rscript {0}

      - name: Fetch podcast data
        run: source("podcasts/podcast_data_actions.R")
        shell: Rscript {0}

      - name: Fetch article data
        run: source("articles/article_data_actions.R")
        shell: Rscript {0}

      - name: Commit and push updated .rds files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcasts/podcast_data.rds articles/article_data.rds
          git diff --cached --quiet || git commit -m "Daily Update"
          git push
